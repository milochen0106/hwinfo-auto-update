name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pester and PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./tests -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) test(s) failed."
          }

      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error)
          if ($issues.Count -gt 0) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            throw "$($issues.Count) PSScriptAnalyzer error(s) found."
          }
          Write-Host 'PSScriptAnalyzer: no errors.'
